# Never append caller-supplied forwarding/identity headers.
proxy_set_header Host algua.itsnix.cloud;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host algua.itsnix.cloud;
proxy_set_header X-Forwarded-Uri $request_uri;
proxy_set_header X-Auth-Request-Redirect https://algua.itsnix.cloud$request_uri;
proxy_set_header Tailscale-User-Login "";
proxy_set_header X-Auth-Request-Email "";
proxy_set_header X-Forwarded-Email "";
proxy_set_header Authorization "";
