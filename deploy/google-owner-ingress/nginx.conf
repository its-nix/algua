# Independent nginx master: never include the shared nginx sites or bind wildcard :443.
user algua-ingress;
worker_processes auto;
pid /run/algua-ingress/nginx.pid;
error_log /var/log/algua-ingress/error.log warn;
events { worker_connections 512; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /run/algua-ingress/client-body;
    proxy_temp_path /run/algua-ingress/proxy;
    upstream google_auth { server unix:/run/algua-google-auth.sock; }
    upstream dashboard { server unix:/run/algua-web/web.sock; }

    server {
        listen 72.61.190.172:443 ssl default_server;
        server_name _;
        ssl_certificate /etc/letsencrypt/live/algua.itsnix.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/algua.itsnix.cloud/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        return 444;
    }
    server {
        listen 72.61.190.172:443 ssl;
        server_name itsnix.cloud;
        ssl_certificate /etc/letsencrypt/live/algua.itsnix.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/algua.itsnix.cloud/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        return 308 https://algua.itsnix.cloud$request_uri;
    }
    server {
        listen 72.61.190.172:443 ssl;
        server_name algua.itsnix.cloud;
        ssl_certificate /etc/letsencrypt/live/algua.itsnix.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/algua.itsnix.cloud/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 20m;

        # No public application exceptions: APIs, assets, healthz and PWA files all use this.
        auth_request /oauth2/auth;
        auth_request_set $verified_email $upstream_http_x_auth_request_email;
        error_page 401 = /oauth2/sign_in;

        location = /oauth2/auth {
            internal;
            auth_request off;
            proxy_pass http://google_auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            include /etc/algua-ingress/oauth-headers.conf;
        }
        location /oauth2/ {
            auth_request off;
            proxy_pass http://google_auth;
            include /etc/algua-ingress/oauth-headers.conf;
            proxy_buffer_size 16k;
            proxy_buffers 4 16k;
        }
        # Fetches must get a refusal, not Google's HTML disguised as an API or service worker.
        location ~ ^/(api(?:/|$)|healthz$|sw\.js$|manifest\.webmanifest$|assets/) {
            error_page 401 = @unauthorized;
            include /etc/algua-ingress/dashboard.conf;
        }
        location / {
            include /etc/algua-ingress/dashboard.conf;
        }
        location @unauthorized {
            auth_request off;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            return 401 '{"error":"authentication_required"}';
        }
    }
}
