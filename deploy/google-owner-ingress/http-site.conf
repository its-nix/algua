# Install ONLY in the existing shared nginx's sites-enabled. Preserve its other sites/listeners.
server {
    listen 80;
    server_name itsnix.cloud algua.itsnix.cloud;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/algua-acme; }
    location / { return 308 https://algua.itsnix.cloud$request_uri; }
}
