# oauth2-proxy v7.15.6. Secrets and owner email are deliberately outside the repository.
provider = "google"
http_address = "fd:3"
redirect_url = "https://algua.itsnix.cloud/oauth2/callback"
whitelist_domains = ["algua.itsnix.cloud"]
authenticated_emails_file = "/etc/algua-google-auth/owner-email"
# No email_domains, wildcard, groups, trusted IPs, JWT bypass, or skip-auth routes.
scope = "openid email profile"
upstreams = ["static://202"]
reverse_proxy = true
set_xauthrequest = true
pass_access_token = false
pass_authorization_header = false
set_authorization_header = false
skip_provider_button = true
code_challenge_method = "S256"
cookie_name = "__Host-algua_owner"
cookie_path = "/"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
# Bounded login sessions; no refresh tokens or split-cookie refresh handling at nginx.
session_cookie_minimal = true
cookie_expire = "1h"
cookie_refresh = "0"
request_logging = false
auth_logging = false
standard_logging = true
