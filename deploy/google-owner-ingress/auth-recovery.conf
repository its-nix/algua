# A cached old worker excludes /api from its shell fallback. This fixed public page can
# repair that worker without exposing application data or changing the owner login gate.
location = /api/auth/recover {
    auth_request off;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    alias /etc/algua-ingress/auth-recovery.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-s7wcIJhZsQObM7HXw/F5/LtIQ1zq7JH1QUjzk/LZCAU='; style-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
}
