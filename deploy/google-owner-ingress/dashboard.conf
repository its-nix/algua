proxy_pass http://dashboard;
proxy_set_header Host algua.itsnix.cloud;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $remote_addr;
# Only the successful auth subrequest supplies this legacy application identity header.
proxy_set_header Tailscale-User-Login $verified_email;
proxy_set_header X-Auth-Request-Email "";
proxy_set_header X-Forwarded-Email "";
proxy_set_header Authorization "";
# Do not share authenticated dashboard responses in intermediaries.
add_header Cache-Control "private, no-store" always;
