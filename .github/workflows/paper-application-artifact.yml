name: Paper application artifact (untrusted draft)

# Owner-reviewed opt-in only. Producing bytes never authorizes adoption or activation.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character main ancestor to package
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  artifact:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_IMAGE: python:3.12.12-bookworm@sha256:c0abd0758831ad99b7a29e0c1a875da9c4abb9a2e3f21e2eeb585dbcadfb6cd0
      SOURCE_SHA: ${{ inputs.source_sha }}
      RECIPE_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: recipe
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        id: uv
        with:
          version: '0.9.30'
          enable-cache: false
      - name: Verify source ancestry and prepare token-free input
        run: |
          python3 recipe/deploy/scripts/produce-paper-artifact.py prepare \
            --repository "$GITHUB_WORKSPACE/recipe" --source-sha "$SOURCE_SHA" \
            --recipe-sha "$RECIPE_SHA" --input "$RUNNER_TEMP/paper-source.git" \
            --context "$RUNNER_TEMP/paper-context.json" --base-image "$BASE_IMAGE"
          mkdir -p "$RUNNER_TEMP/paper-build/tmp"
      - name: Build without runner credentials or writable recipe/source
        env:
          UV_BINARY: ${{ steps.uv.outputs.uv-path }}
        run: |
          docker run --rm --read-only --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --cpus 2 --memory 4g \
            --mount "type=bind,src=$RUNNER_TEMP/paper-source.git,dst=/source,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/recipe/deploy/scripts/build-paper-release.py,dst=/builder.py,readonly" \
            --mount "type=bind,src=$UV_BINARY,dst=/usr/local/bin/uv,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/paper-build,dst=/work" \
            --env TMPDIR=/work/tmp --env PYTHONDONTWRITEBYTECODE=1 \
            "$BASE_IMAGE" python /builder.py --repository /source --commit "$SOURCE_SHA" \
            --output /work/release --descriptor /work/release-spec.json
      - name: Reconstruct safe Git metadata and package bytes
        run: |
          python3 recipe/deploy/scripts/produce-paper-artifact.py package \
            --release "$RUNNER_TEMP/paper-build/release" \
            --descriptor "$RUNNER_TEMP/paper-build/release-spec.json" \
            --input "$RUNNER_TEMP/paper-source.git" --context "$RUNNER_TEMP/paper-context.json" \
            --output "$RUNNER_TEMP/paper-distribution"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paper-application-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paper-distribution/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
